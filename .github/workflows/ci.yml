name: CI

on:
  push:
  pull_request:

jobs:
  quick-checks:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MARXOS_DEV_MODE: "1"
      MARXOS_TRACE_ONLY: "1"
      MARXOS_LLM_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run quick validation
        run: python scripts/check.py --mode quick

      - name: Run isolated Web tests
        run: python scripts/test.py web

      - name: Run versioned offline Web smoke
        run: python scripts/run_web_smoke_ci.py --report logs/web_smoke_ci.json

  metadata-eval:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      MARXOS_DEV_MODE: "1"
      MARXOS_TRACE_ONLY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run metadata evaluation (work≥85%, citation≥70%)
        run: python scripts/evaluate_e2e.py --dataset eval_dataset_v2.json --ci --threshold 85 --citation-threshold 70
